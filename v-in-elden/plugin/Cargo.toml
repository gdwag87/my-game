[package]
name = "v_in_elden"
version = "0.1.0"
edition = "2021"
description = "V in the Lands Between - stage 1: dash + double jump"

[lib]
crate-type = ["cdylib"]

[dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation", "Win32_System_SystemServices", "Win32_System_Threading",
  "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse",
] }

[profile.release]
panic = "unwind"
lto = true

[target."cfg(windows)".dependencies]
eldenring = { git = "https://github.com/vswarte/fromsoftware-rs", rev = "59fbd3b3b7daaf14aca47c9f73530493dba6bc79" }
fromsoftware-shared = { git = "https://github.com/vswarte/fromsoftware-rs", rev = "59fbd3b3b7daaf14aca47c9f73530493dba6bc79" }
glam = "0.30"
